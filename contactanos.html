<style>

*{
margin:0;
padding:0;

body{

min-height:100vh;
background:linear-gradient(135deg,#eef4ff,#dbe9ff,#c6dcff);
display:flex;
flex-direction:column;
}

/* NAVBAR */

.navbar{
width:100%;
padding:15px 40px;
display:flex;
align-items:center;
justify-content:space-between;
background:rgba(31,60,136,0.9);
backdrop-filter:blur(10px);
color:white;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.navbar-left{
display:flex;
align-items:center;
gap:15px;
}

.navbar img{
height:45px;
}

.navbar h2{
font-size:20px;
letter-spacing:2px;
}

/* CONTENIDO */

.container{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:50px 20px;
animation:fadeIn 1s ease;
}

h1{
margin-bottom:40px;
font-size:32px;
letter-spacing:3px;
color:#1f3c88;
}

/* BOTONES */

.socials{
display:flex;
flex-direction:column;
gap:20px;
}

.social-btn{
width:300px;
padding:16px;
border-radius:50px;
text-decoration:none;
font-weight:600;
color:white;
display:flex;
align-items:center;
gap:15px;
padding-left:30px;
font-size:16px;
transition:0.3s;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.social-btn:hover{
transform:translateY(-5px) scale(1.03);
box-shadow:0 20px 35px rgba(0,0,0,0.3);
}

.facebook{background:linear-gradient(135deg,#1877f2,#4b7bec);}
.whatsapp{background:linear-gradient(135deg,#25d366,#128c7e);}
.tiktok{background:linear-gradient(135deg,#000,#444);}
.maps{background:linear-gradient(135deg,#ea4335,#c5221f);}
.phone{background:linear-gradient(135deg,#444,#777);}

/* MAPA */

.map{
margin-top:60px;
width:100%;
max-width:800px;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

/* BOTON REGRESAR */

.back-btn{
margin-top:40px;
padding:14px 45px;
border-radius:50px;
text-decoration:none;
font-weight:600;
background:linear-gradient(135deg,#1f3c88,#3c78d8);
color:white;
transition:0.3s;
box-shadow:0 10px 25px rgba(31,60,136,0.3);
}

.back-btn:hover{
transform:translateY(-4px);
}

/* FOOTER */

footer{
margin-top:60px;
padding:25px;
background:#1f3c88;
color:white;
text-align:center;
font-size:14px;
}

/* WHATSAPP FLOTANTE */

.whatsapp-float{
position:fixed;
bottom:25px;
right:25px;
background:#25d366;
color:white;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
text-decoration:none;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
transition:0.3s;
z-index:999;
}

.whatsapp-float:hover{
transform:scale(1.1);
}

/* ANIMACION */

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* RESPONSIVE */

@media(max-width:500px){

.navbar{
padding:15px 20px;
}

.navbar h2{
font-size:16px;
}

.social-btn{
width:100%;
max-width:320px;
}

}

</style>
</head>
