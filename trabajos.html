<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trabajos - Impresiones Compás</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#eef4ff,#dbe9ff,#c6dcff);
}

/* NAVBAR */
.navbar{
  width:100%;
  padding:15px 40px;
  display:flex;
  align-items:center;
  background:#1f3c88;
  color:white;
}

.navbar img{height:45px;margin-right:10px;}

/* CONTENIDO */
.container{
  padding:60px 20px;
  max-width:1200px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:36px;
  color:#1f3c88;
  margin-bottom:10px;
}

.sub{text-align:center;color:#555;margin-bottom:40px;}

/* GALERIA SIMPLE */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  height:250px;
  border-radius:15px;
  overflow:hidden;
}

.card img,
.card video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* BOTON */
.back-btn{
  display:block;
  margin:40px auto;
  padding:12px 40px;
  border-radius:50px;
  text-decoration:none;
  background:#1f3c88;
  color:white;
  width:max-content;
}

/* FOOTER */
footer{
  padding:20px;
  background:#1f3c88;
  color:white;
  text-align:center;
}
</style>
</head>

<body>

<div class="navbar">
  <img src="logo.png">
  <h2>IMPRESIONES COMPÁS</h2>
</div>

<div class="container">

  <h1>NUESTROS TRABAJOS</h1>
  <p class="sub">Algunos de nuestros trabajos</p>

  <!-- Aquí agregas tus fotos manualmente -->
  <div class="grid">
    <div class="card"><img src="https://github.com/usuario/repositorio/raw/main/fotos/stickers.jpg"></div>
    <div class="card"><img src="https://github.com/usuario/repositorio/raw/main/fotos/vinil.jpg"></div>
    <div class="card"><img src="https://github.com/usuario/repositorio/raw/main/fotos/playera.jpg"></div>
    <!-- Agrega más imágenes según necesites -->
  </div>

  <a href="index.html" class="back-btn">⬅ REGRESAR</a>
</div>

<footer>
  © 2026 Impresiones Compás
</footer>

</body>
</html>
