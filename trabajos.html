<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Impresiones Compás</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#eef4ff,#dbe9ff,#c6dcff);
}

/* NAVBAR */
.navbar{
width:100%;
padding:15px 40px;
display:flex;
align-items:center;
justify-content:space-between;
background:#1f3c88;
color:white;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.navbar img{height:45px;}

.menu a{
color:white;
margin-left:20px;
text-decoration:none;
font-weight:500;
}

/* HERO */
.hero{
text-align:center;
padding:60px 20px;
}

.hero h1{
font-size:40px;
color:#1f3c88;
}

.hero p{
color:#555;
margin-top:10px;
}

/* PRODUCTOS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
padding:40px;
max-width:1100px;
margin:auto;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.15);
transition:.3s;
text-align:center;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card h3{margin:15px 0;color:#1f3c88;}
.card p{color:#555;padding:0 15px;}

.card button{
margin:15px;
padding:10px 20px;
border:none;
border-radius:30px;
background:#1f3c88;
color:white;
cursor:pointer;
}

.card:hover{
transform:translateY(-10px);
}

/* MODAL PRODUCTO */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
display:none;
align-items:center;
justify-content:center;
z-index:1000;
}

.modal-content{
background:white;
padding:30px;
border-radius:15px;
width:90%;
max-width:400px;
}

.modal-content h2{
color:#1f3c88;
margin-bottom:15px;
}

.modal-content label{
display:block;
margin-top:10px;
}

.modal-content input,
.modal-content select{
width:100%;
padding:8px;
margin-top:5px;
}

.modal-content button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:30px;
background:#1f3c88;
color:white;
cursor:pointer;
}

.whatsapp-btn{
display:block;
text-align:center;
margin-top:10px;
color:#25d366;
text-decoration:none;
}

/* FOOTER */
footer{
margin-top:60px;
padding:25px;
background:#1f3c88;
color:white;
text-align:center;
}

/* WHATSAPP FLOAT */
.whatsapp{
position:fixed;
bottom:25px;
right:25px;
background:#25d366;
color:white;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
text-decoration:none;
box-shadow:0 10px 25px rgba(0,0,0,.3);
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
<div style="display:flex;align-items:center;">
<img src="logo.png">
<h2 style="margin-left:10px;">IMPRESIONES COMPÁS</h2>
</div>

<div class="menu">
<a href="#">Inicio</a>
<a href="#">Productos</a>
<a href="#">Contacto</a>
</div>
</div>

<!-- HERO -->
<div class="hero">
<h1>Compra tus impresiones en línea</h1>
<p>Selecciona tu producto, sube tu diseño y paga fácil</p>
</div>

<!-- PRODUCTOS -->
<div class="products">

<div class="card">
<img src="lona1.jpg">
<h3>Lonas</h3>
<p>Impresión en lona resistente</p>
<button onclick="abrirModal('Lona')">VER MÁS</button>
</div>

<div class="card">
<img src="stickers.jpg">
<h3>Stickers</h3>
<p>Vinil adhesivo personalizado</p>
<button onclick="abrirModal('Sticker')">VER MÁS</button>
</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">

<h2 id="productoTitulo"></h2>

<label>Medida</label>
<select>
<option>1x1</option>
<option>2x1</option>
</select>

<label>Cantidad</label>
<input type="number" value="1">

<label>Subir diseño</label>
<input type="file">

<button onclick="pagar()">PAGAR</button>

<a href="https://wa.me/5218781280497" class="whatsapp-btn">
¿No tienes diseño? Cotiza por WhatsApp
</a>

</div>
</div>

<!-- WHATSAPP -->
<a href="https://wa.me/5218781280497" class="whatsapp">
<i class="fab fa-whatsapp"></i>
</a>

<!-- FOOTER -->
<footer>© 2026 Impresiones Compás</footer>

<script>
function abrirModal(producto){
document.getElementById("modal").style.display="flex";
document.getElementById("productoTitulo").innerText = producto;
}

window.onclick = function(e){
if(e.target.id === "modal"){
document.getElementById("modal").style.display="none";
}
}

function pagar(){
alert("Aquí conectarías Mercado Pago");
}
</script>

</body>
</html>
