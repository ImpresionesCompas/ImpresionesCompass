<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trabajos - Impresiones Compás</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#eef4ff,#dbe9ff,#c6dcff);
min-height:100vh;
display:flex;
flex-direction:column;
}

/* NAVBAR */

.navbar{
width:100%;
padding:15px 40px;
display:flex;
align-items:center;
background:rgba(31,60,136,0.95);
color:white;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
border-bottom:3px solid #3c78d8;
}

.navbar-left{
display:flex;
align-items:center;
gap:15px;
}

.navbar img{
height:45px;
}

.navbar h2{
font-size:20px;
letter-spacing:2px;
}

/* CONTENIDO */

.container{
flex:1;
padding:60px 20px;
text-align:center;
animation:fadeIn 1s ease;
}

h1{
font-size:36px;
letter-spacing:4px;
color:#1f3c88;
margin-bottom:10px;
}

.sub{
color:#555;
margin-bottom:50px;
}

/* SECCIONES */

.section{
max-width:1100px;
margin:60px auto;
text-align:left;
}

.section h2{
color:#1f3c88;
margin-bottom:20px;
letter-spacing:2px;
}

/* CARRUSEL */

.carousel{
position:relative;
overflow:hidden;
}

.carousel-track{
display:flex;
gap:20px;
overflow-x:auto;
scroll-behavior:smooth;
}

.carousel-track img{
width:260px;
height:260px;
object-fit:cover;
border-radius:15px;
cursor:pointer;
box-shadow:0 8px 20px rgba(0,0,0,.2);
}

/* FLECHAS */

.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
background:white;
border:none;
font-size:25px;
width:45px;
height:45px;
border-radius:50%;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,.3);
z-index:10;
}

.arrow-left{
left:10px;
}

.arrow-right{
right:10px;
}

/* BOTON REGRESAR */

.back{
margin-top:60px;
text-align:center;
}

.btn{
padding:15px 45px;
border-radius:50px;
text-decoration:none;
background:linear-gradient(135deg,#1f3c88,#3c78d8);
color:white;
font-weight:600;
transition:0.3s;
box-shadow:0 10px 25px rgba(31,60,136,0.4);
}

.btn:hover{
transform:translateY(-5px);
}

/* LIGHTBOX */

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:0.3s;
z-index:1000;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:10px;
}

.lightbox.show{
opacity:1;
pointer-events:auto;
}

/* FOOTER */

footer{
margin-top:60px;
padding:25px;
background:#1f3c88;
color:white;
text-align:center;
font-size:14px;
}

/* WHATSAPP */

.whatsapp-float{
position:fixed;
bottom:25px;
right:25px;
background:#25d366;
color:white;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
text-decoration:none;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
transition:0.3s;
z-index:999;
}

.whatsapp-float:hover{
transform:scale(1.1);
}

/* ANIMACION */

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">
<div class="navbar-left">
<img src="logo.png">
<h2>IMPRESIONES COMPÁS</h2>
</div>
</div>

<div class="container">

<h1>NUESTROS TRABAJOS</h1>

<p class="sub">
Algunos de nuestros trabajos de impresión, stickers, lonas, vinil y más.
</p>

<!-- STICKERS -->

<div class="section">

<h2>STICKERS</h2>

<div class="carousel">

<button class="arrow arrow-left" onclick="moveSlide(this,-1)">❮</button>

<div class="carousel-track">

<img src="s1.jpg">
<img src="s2.jpg">
<img src="s3.jpg">
<img src="s4.jpg">

</div>

</div>

</div>

<!-- VINIL -->

<div class="section">

<h2>VINIL</h2>

<div class="carousel">

<button class="arrow arrow-left" onclick="moveSlide(this,-1)">❮</button>

<div class="carousel-track">

<img src="v1.jpg">
<img src="v2.jpg">
<img src="v3.jpg">
<img src="v4.jpg">

</div>

<button class="arrow arrow-right" onclick="moveSlide(this,1)">❯</button>

</div>

</div>

<!-- LONAS -->

<div class="section">

<h2>LONAS</h2>

<div class="carousel">

<button class="arrow arrow-left" onclick="moveSlide(this,-1)">❮</button>

<div class="carousel-track">

<img src="l1.jpg">

<img src="l3.jpg">
<img src="l4.jpg">

</div>

<!-- DISEÑOS -->

<div class="section">

<div class="carousel">

<div class="back">
<a href="index.html" class="btn">⬅ REGRESAR</a>
</div>

</div>

<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">
<img id="lightbox-img">
</div>

<!-- WHATSAPP -->

<a href="https://wa.me/5218781280497" class="whatsapp-float" target="_blank">
<i class="fab fa-whatsapp"></i>
</a>

<footer>
© 2026 Impresiones Compás — Todos los derechos reservados
</footer>

<script>

/* CARRUSEL */

function moveSlide(button,direction){

const carousel = button.parentElement
const track = carousel.querySelector(".carousel-track")

track.scrollBy({
left: direction * 300,
behavior:"smooth"
})

}

/* LIGHTBOX */

const lightbox=document.getElementById("lightbox")
const lightboxImg=document.getElementById("lightbox-img")

document.querySelectorAll(".carousel-track img").forEach(img=>{

img.addEventListener("click",()=>{

lightbox.classList.add("show")
lightboxImg.src=img.src

})

})

lightbox.addEventListener("click",()=>{
lightbox.classList.remove("show")
})

</script>

</body>
</html>
