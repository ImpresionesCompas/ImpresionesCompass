<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Impresiones Compás</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#eef4ff,#dbe9ff,#c6dcff);
}

/* NAVBAR */
.navbar{
padding:15px 40px;
display:flex;
justify-content:space-between;
align-items:center;
background:#1f3c88;
color:white;
}

.navbar img{height:45px;}

.menu a{
color:white;
margin-left:20px;
text-decoration:none;
}

/* HERO */
.hero{
text-align:center;
padding:50px 20px;
}

.hero h1{
font-size:38px;
color:#1f3c88;
}

/* QUIENES SOMOS */
.about{
display:flex;
align-items:center;
justify-content:center;
gap:60px;
padding:100px 40px;
max-width:1200px;
margin:60px auto;
background:linear-gradient(135deg,#1f3c88,#3c78d8);
border-radius:25px;
color:white;
box-shadow:0 20px 50px rgba(0,0,0,.25);
position:relative;
overflow:hidden;
}

.about::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(255,255,255,.3),transparent);
transition:.6s;
}

.about:hover::before{left:100%;}
.about:hover{transform:scale(1.02);}

.about-text h2{font-size:36px;margin-bottom:20px;}
.about-text p{font-size:18px;line-height:1.8;}

.about-img{
flex:1;
display:flex;
justify-content:center;
}

.about-img img{
width:300px;
height:300px;
object-fit:cover;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.4);
}

/* CARRUSEL */
.carousel-section{
padding:50px 20px;
text-align:center;
}

.carousel{
position:relative;
max-width:1100px;
margin:auto;
}

.carousel-track{
display:flex;
gap:20px;
overflow-x:auto;
scroll-behavior:smooth;
padding:20px;
}

.card{
min-width:250px;
background:white;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
text-align:center;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card a{
display:inline-block;
margin:15px;
padding:10px 20px;
background:#25d366;
color:white;
border-radius:30px;
text-decoration:none;
}

/* RESEÑAS */
.review img{
width:50px;
height:50px;
border-radius:50%;
}

/* CTA */
.cta{
margin:60px auto;
max-width:900px;
padding:50px;
text-align:center;
background:linear-gradient(135deg,#1f3c88,#3c78d8);
color:white;
border-radius:25px;
}

/* FOOTER */
footer{
margin-top:60px;
padding:25px;
background:#1f3c88;
color:white;
text-align:center;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:25px;
right:25px;
background:#25d366;
color:white;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}
</style>
</head>

<body>

<div class="navbar">
<div style="display:flex;align-items:center;">
<img src="logo.png">
<h2 style="margin-left:10px;">IMPRESIONES COMPÁS</h2>
</div>

<div class="menu">
<a href="#">Inicio</a>
<a href="#">Productos</a>
<a href="#">Contacto</a>
</div>
</div>

<div class="hero">
<h1>Impresión profesional fácil y rápida</h1>
</div>

<!-- QUIENES SOMOS -->
<div class="about">
<div class="about-text">
<h2>¿Quiénes somos?</h2>
<p>Somos una imprenta dedicada a ofrecer soluciones de alta calidad.</p>
</div>

<div class="about-img">
<img src="imprenta.jpg">
</div>
</div>


</body>
</html>
