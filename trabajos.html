
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trabajos - Impresiones Compás</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#eef4ff,#dbe9ff,#c6dcff);
min-height:100vh;
display:flex;
flex-direction:column;
}

/* NAVBAR */

.navbar{
width:100%;
padding:15px 40px;
display:flex;
align-items:center;
justify-content:space-between;
background:rgba(31,60,136,0.95);
backdrop-filter:blur(10px);
color:white;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
border-bottom:3px solid #3c78d8;
}

.navbar-left{
display:flex;
align-items:center;
gap:15px;
}

.navbar img{
height:45px;
}

.navbar h2{
font-size:20px;
letter-spacing:2px;
}

/* CONTENIDO */

.container{
flex:1;
padding:60px 20px;
text-align:center;
animation:fadeIn 1s ease;
}

h1{
font-size:36px;
letter-spacing:4px;
color:#1f3c88;
margin-bottom:10px;
}

.sub{
color:#555;
margin-bottom:50px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:40px;
max-width:1100px;
margin:auto;
}

/* ITEM */

.item{
background:white;
border-radius:20px;
padding:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
transition:0.4s;
cursor:pointer;
}

.item:hover{
transform:translateY(-10px);
box-shadow:0 20px 35px rgba(0,0,0,0.25);
}

.item img,
.video-hover{
width:100%;
height:320px;
object-fit:contain;
background:#f5f5f5;
border-radius:15px;
transition:0.4s;
}

.item:hover img{
transform:scale(1.05);
}

/* TEXTO */

.caption{
margin-top:15px;
font-weight:600;
color:#1f3c88;
letter-spacing:1px;
}

/* BOTON */

.back{
margin-top:60px;
}

.btn{
padding:15px 45px;
border-radius:50px;
text-decoration:none;
background:linear-gradient(135deg,#1f3c88,#3c78d8);
color:white;
font-weight:600;
transition:0.3s;
box-shadow:0 10px 25px rgba(31,60,136,0.4);
}

.btn:hover{
transform:translateY(-5px);
}

/* LIGHTBOX */

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:0.3s;
z-index:1000;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:10px;
}

.lightbox.show{
opacity:1;
pointer-events:auto;
}

/* FOOTER */

footer{
margin-top:60px;
padding:25px;
background:#1f3c88;
color:white;
text-align:center;
font-size:14px;
}

/* WHATSAPP FLOTANTE */

.whatsapp-float{
position:fixed;
bottom:25px;
right:25px;
background:#25d366;
color:white;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
text-decoration:none;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
transition:0.3s;
z-index:999;
}

.whatsapp-float:hover{
transform:scale(1.1);
}

/* ANIMACION */

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* RESPONSIVE */

@media(max-width:600px){

.navbar{
padding:15px 20px;
}

.navbar h2{
font-size:16px;
}

}

</style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">
<div class="navbar-left">
<img src="logo.png">
<h2>IMPRESIONES COMPÁS</h2>
</div>
</div>

<!-- CONTENIDO -->

<div class="container">

<h1>NUESTROS TRABAJOS</h1>

<p class="sub">
Algunos de nuestros trabajos de impresión, stickers, lonas, recorte de vinil y más.
</p>

<div class="grid">

<div class="item">
<img src="stickers.jpg">
<div class="caption">Stickers personalizados</div>
</div>

<div class="item">
<video class="video-hover" muted loop>
<source src="video1.mp4" type="video/mp4">
</video>
<div class="caption">Proceso de impresión</div>
</div>

<div class="item">
<img src="img2.jpg">
<div class="caption">Vinil decorativo</div>
</div>

<div class="item">
<video class="video-hover" muted loop>
<source src="video2.mp4" type="video/mp4">
</video>
<div class="caption">Recorte de vinil</div>
</div>

<div class="item">
<video class="video-hover" muted loop>
<source src="video3.mp4" type="video/mp4">
</video>
<div class="caption">---</div>
</div>

<div class="item">
<video class="video-hover" muted loop>
<source src="video4.mp4" type="video/mp4">
</video>
<div class="caption">--</div>
</div>

</div>

<div class="back">
<a href="index.html" class="btn">⬅ REGRESAR</a>
</div>

</div>

<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">
<img id="lightbox-img">
</div>

<!-- BOTON WHATSAPP -->

<a href="https://wa.me/5218781280497" class="whatsapp-float" target="_blank">
<i class="fab fa-whatsapp"></i>
</a>

<!-- FOOTER -->

<footer>
© 2026 Impresiones Compás — Todos los derechos reservados
</footer>

<script>

/* VIDEOS HOVER */

document.querySelectorAll('.video-hover').forEach(video => {

video.addEventListener('mouseenter',()=>{
video.play()
})

video.addEventListener('mouseleave',()=>{
video.pause()
video.currentTime=0
})

})

/* LIGHTBOX */

const lightbox=document.getElementById("lightbox")
const lightboxImg=document.getElementById("lightbox-img")

document.querySelectorAll(".item img").forEach(img=>{

img.addEventListener("click",()=>{

lightbox.classList.add("show")
lightboxImg.src=img.src

})

})

lightbox.addEventListener("click",()=>{
lightbox.classList.remove("show")
})

</script>

</body>
</html>
```
