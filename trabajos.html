<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trabajos - Impresiones Compás</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#eef4ff,#dbe9ff,#c6dcff);
}

/* NAVBAR */
.navbar{
padding:15px 40px;
display:flex;
align-items:center;
background:#1f3c88;
color:white;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.navbar img{height:45px;margin-right:10px;}

/* CONTENIDO */
.container{padding:60px 20px;max-width:1200px;margin:auto;}

h1{text-align:center;font-size:36px;color:#1f3c88;margin-bottom:10px;}
.sub{text-align:center;color:#555;margin-bottom:50px;}

/* SECCIONES */
.section{
margin-bottom:70px;
opacity:0;
transform:translateY(40px);
transition:1s;
}
.section.show{opacity:1;transform:translateY(0);}

.section h2{color:#1f3c88;margin-bottom:20px;}

/* CARRUSEL */
.carousel{position:relative;}
.carousel-track{
display:flex;
gap:20px;
overflow-x:auto;
scroll-behavior:smooth;
padding:20px 0;
}

/* TARJETAS */
.card{
min-width:260px;
height:260px;
border-radius:15px;
overflow:hidden;
position:relative;
cursor:pointer;
transition:.4s;
}

.card img,
.card video{
width:100%;
height:100%;
object-fit:cover;
}

/* HOVER PRO */
.card:hover{
transform:scale(1.15);
z-index:5;
box-shadow:0 20px 40px rgba(0,0,0,.4);
}

/* OVERLAY */
.overlay{
position:absolute;
bottom:0;
width:100%;
background:linear-gradient(transparent,rgba(0,0,0,.8));
color:white;
padding:10px;
font-size:14px;
opacity:0;
transition:.3s;
}

.card:hover .overlay{opacity:1;}

/* PLAY ICON */
.play{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:40px;
color:white;
background:rgba(0,0,0,.5);
width:70px;
height:70px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
}

/* FLECHAS */
.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
background:white;
border:none;
width:45px;
height:45px;
border-radius:50%;
cursor:pointer;
opacity:0;
}
.carousel:hover .arrow{opacity:1;}
.arrow-left{left:-10px;}
.arrow-right{right:-10px;}

/* LIGHTBOX */
.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:.3s;
z-index:1000;
flex-direction:column;
}

.lightbox img,
.lightbox video{
max-width:90%;
max-height:80%;
border-radius:10px;
}

.lightbox.show{opacity:1;pointer-events:auto;}

/* WHATS */
.whatsapp{
position:fixed;
bottom:25px;
right:25px;
background:#25d366;
color:white;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

/* BOTON */
.back-btn{
display:block;
margin:40px auto;
padding:14px 45px;
border-radius:50px;
text-decoration:none;
background:#1f3c88;
color:white;
}

/* FOOTER */
footer{
padding:25px;
background:#1f3c88;
color:white;
text-align:center;
}

</style>
</head>

<body>

<div class="navbar">
<img src="logo.png">
<h2>IMPRESIONES COMPÁS</h2>
</div>

<div class="container">

<h1>NUESTROS TRABAJOS</h1>
<p class="sub">Calidad profesional en cada proyecto</p>

<script>
function crearSeccion(titulo,prefix){
document.write(`
<div class="section">
<h2>${titulo}</h2>

<div class="carousel">
<button class="arrow arrow-left" onclick="move(this,-1)">❮</button>

<div class="carousel-track">

<div class="card">
<img src="${prefix}1.jpg">
<div class="overlay">${titulo}</div>
</div>

<div class="card video-card">
<video muted loop class="auto-video">
<source src="${prefix}_video.mp4" type="video/mp4">
</video>
<div class="play"><i class="fas fa-play"></i></div>
<div class="overlay">Ver video</div>
</div>

<div class="card">
<img src="${prefix}2.jpg">
<div class="overlay">${titulo}</div>
</div>

<div class="card">
<img src="${prefix}3.jpg">
<div class="overlay">${titulo}</div>
</div>

</div>

<button class="arrow arrow-right" onclick="move(this,1)">❯</button>
</div>
</div>
`)
}
</script>

<script>
crearSeccion("STICKERS","s")
crearSeccion("VINIL","v")
crearSeccion("FIGURAS DE COROPLAST","coro")
crearSeccion("BORDADO","bordado")
crearSeccion("SELLOS","sello")
crearSeccion("LONAS","lona")
crearSeccion("PLAYERAS","playera")
crearSeccion("TABLOIDES","tabloide")
crearSeccion("SERIGRAFÍA","seri")
crearSeccion("MICROPERFORADO","micro")
crearSeccion("VINIL DE CORTE","vc")
</script>

<a href="index.html" class="back-btn">⬅ REGRESAR</a>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox"></div>

<a href="https://wa.me/5218781280497" class="whatsapp">
<i class="fab fa-whatsapp"></i>
</a>

<footer>© 2026 Impresiones Compás</footer>

<script>

/* CARRUSEL */
function move(btn,dir){
const track=btn.parentElement.querySelector(".carousel-track")
track.scrollBy({left:dir*320,behavior:"smooth"})
}

/* LIGHTBOX PRO */
const lightbox=document.getElementById("lightbox")

document.addEventListener("click",e=>{
const card=e.target.closest(".card")
if(!card)return

lightbox.innerHTML=""

if(card.querySelector("video")){
const video=document.createElement("video")
video.src=card.querySelector("source").src
video.controls=true
video.autoplay=true
lightbox.appendChild(video)
}else{
const img=document.createElement("img")
img.src=card.querySelector("img").src
lightbox.appendChild(img)
}

lightbox.classList.add("show")
})

lightbox.onclick=()=>lightbox.classList.remove("show")

/* AUTO VIDEO */
const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
entry.isIntersecting?entry.target.play():entry.target.pause()
})
})

document.querySelectorAll(".auto-video").forEach(v=>observer.observe(v))

/* SCROLL */
const obs=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting)entry.target.classList.add("show")
})
})

document.querySelectorAll(".section").forEach(sec=>obs.observe(sec))

</script>

</body>
</html>
